---
# Target containerized environment settings
ansible_become: false

# Containerized installer inventory path
containerized_installer_inventory: ~/inventory

# Target database connection (populated during target assessment)
# target_pg_host: target-db.example.com
# target_pg_admin_user: postgres

# Service unit lists for stop/start operations
controller_services:
  - automation-controller-task
  - automation-controller-web
  - automation-controller-rsyslog
controller_extra_services:
  - receptor
hub_services:
  - automation-hub-api
  - automation-hub-content
  - automation-hub-web
  - automation-hub-worker-1
  - automation-hub-worker-2
eda_services:
  - automation-eda-scheduler
  - automation-eda-daphne
  - automation-eda-web
  - automation-eda-api
  - automation-eda-worker-1
  - automation-eda-worker-2
  - automation-eda-activation-worker-1
  - automation-eda-activation-worker-2
gateway_services:
  - automation-gateway
  - automation-gateway-proxy
redis_services:
  - redis-unix
  - redis-tcp
pcp_service: pcp

# Gateway admin credentials
# gateway_admin_user: admin
# gateway_admin_password: defined in vault.yml
