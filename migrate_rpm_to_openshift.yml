---
# AAP 2.6 Migration: RPM-based to OpenShift Container Platform
# Follows Red Hat AAP 2.6 Migration Guide phases 1-7

# Phase 0: Common prerequisites
- name: "Phase 0: Validate prerequisites"
  hosts: all
  gather_facts: true
  tags: [assess]
  roles:
    - common

# Phase 1: Assess RPM source environment
- name: "Phase 1: Assess source RPM environment"
  hosts: source
  gather_facts: true
  tags: [assess]
  roles:
    - source_assess

# Phase 2-3: Export source environment and create artifact
- name: "Phase 2-3: Export source environment and create migration artifact"
  hosts: source
  gather_facts: false
  tags: [export, slow]
  roles:
    - source_export

# Phase 4: Assess OpenShift target environment
- name: "Phase 4: Assess target OpenShift environment"
  hosts: target_ocp_bastion
  gather_facts: true
  tags: [assess]
  roles:
    - target_openshift_assess

# Phase 5: Import migration content to OpenShift target
- name: "Phase 5: Import migration content to OpenShift target"
  hosts: target_ocp_bastion
  gather_facts: false
  tags: [import, slow]
  roles:
    - target_openshift_import

# Phase 6: Reconcile OpenShift target environment
- name: "Phase 6: Reconcile OpenShift target environment"
  hosts: target_ocp_bastion
  gather_facts: false
  tags: [reconcile]
  roles:
    - target_openshift_reconcile

# Phase 7: Validate OpenShift target environment
- name: "Phase 7: Validate OpenShift target environment"
  hosts: target_ocp_bastion
  gather_facts: false
  tags: [validate]
  roles:
    - validate
