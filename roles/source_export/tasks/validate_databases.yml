---
- name: Check database sizes (managed)
  ansible.builtin.command:
    cmd: psql -t -c '\l+'
  become: true
  become_user: postgres
  delegate_to: "{{ groups['source_db'][0] }}"
  register: db_sizes
  changed_when: false
  when: source_db_type == 'managed'

- name: Check database sizes (external)
  ansible.builtin.command:
    cmd: >-
      psql -h {{ source_pg_host }} -p {{ source_pg_port }}
      -U {{ source_pg_admin_user }} -d postgres -t -c '\l+'
  delegate_to: "{{ groups['source_gateway'][0] }}"
  environment:
    PGPASSWORD: "{{ source_pg_admin_password }}"
    PGSSLMODE: "{{ source_pg_ssl_mode }}"
  register: db_sizes
  changed_when: false
  when: source_db_type == 'external'

- name: Display database sizes
  ansible.builtin.debug:
    var: db_sizes.stdout_lines
  run_once: true

- name: Ensure parent directory exists for filesystem space check
  ansible.builtin.file:
    path: "{{ artifact_dir | dirname }}"
    state: directory
    mode: "0755"
  delegate_to: "{{ groups['source_gateway'][0] }}"

- name: Check available filesystem space on gateway node
  ansible.builtin.command:
    cmd: "df -h {{ artifact_dir | dirname }}"
  delegate_to: "{{ groups['source_gateway'][0] }}"
  register: fs_space
  changed_when: false

- name: Display available filesystem space
  ansible.builtin.debug:
    var: fs_space.stdout_lines
  run_once: true
