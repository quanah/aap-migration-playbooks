---
- name: Generate checksums for database dump files
  ansible.builtin.shell:
    cmd: >-
      cd {{ artifact_dir }} &&
      rm -f sha256sum.txt &&
      find . -type f -name "*.pgc" -exec sha256sum {} \; > sha256sum.txt
  delegate_to: "{{ groups['source_gateway'][0] }}"
  run_once: true

- name: Display checksums
  ansible.builtin.command:
    cmd: "cat {{ artifact_dir }}/sha256sum.txt"
  delegate_to: "{{ groups['source_gateway'][0] }}"
  register: checksums
  changed_when: false
  run_once: true

- name: Show artifact checksums
  ansible.builtin.debug:
    var: checksums.stdout_lines
  run_once: true

- name: Create artifact tarball
  ansible.builtin.command:
    cmd: "tar cf {{ artifact_archive }} -C {{ artifact_dir | dirname }} {{ artifact_dir | basename }}"
  delegate_to: "{{ groups['source_gateway'][0] }}"
  run_once: true

- name: Generate artifact tarball checksum
  ansible.builtin.shell:
    cmd: "sha256sum {{ artifact_archive }} > {{ artifact_checksum }}"
  delegate_to: "{{ groups['source_gateway'][0] }}"
  run_once: true

- name: Verify artifact tarball checksum
  ansible.builtin.command:
    cmd: "sha256sum --check {{ artifact_checksum }}"
  delegate_to: "{{ groups['source_gateway'][0] }}"
  changed_when: false
  run_once: true

- name: List artifact contents
  ansible.builtin.command:
    cmd: "tar tvf {{ artifact_archive }}"
  delegate_to: "{{ groups['source_gateway'][0] }}"
  register: artifact_contents
  changed_when: false
  run_once: true

- name: Display artifact contents
  ansible.builtin.debug:
    var: artifact_contents.stdout_lines
  run_once: true

- name: Artifact packaging complete
  ansible.builtin.debug:
    msg: |
      Migration artifact created successfully:
        Archive: {{ artifact_archive }}
        Checksum: {{ artifact_checksum }}
      Transfer the artifact to the target environment to continue migration.
  run_once: true
