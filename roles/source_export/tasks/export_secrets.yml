---
- name: Gather controller secret key
  ansible.builtin.slurp:
    src: "{{ controller_secret_key_path }}"
  delegate_to: "{{ groups['source_controller'][0] }}"
  register: controller_secret_raw
  when: migrate_controller | default(true)
  run_once: true

- name: Gather hub secret key
  ansible.builtin.shell:
    cmd: "grep '^SECRET_KEY' {{ hub_settings_path }} | awk -F'=' '{ print $2 }'"
  delegate_to: "{{ groups['source_hub'][0] }}"
  register: hub_secret_raw
  changed_when: false
  when: migrate_hub | default(true)
  run_once: true

- name: Gather hub database fields encryption key
  ansible.builtin.slurp:
    src: "{{ hub_db_fields_key_path }}"
  delegate_to: "{{ groups['source_hub'][0] }}"
  register: hub_db_fields_key_raw
  when: migrate_hub | default(true)
  run_once: true

- name: Gather gateway secret key
  ansible.builtin.slurp:
    src: "{{ gateway_secret_key_path }}"
  delegate_to: "{{ groups['source_gateway'][0] }}"
  register: gateway_secret_raw
  when: migrate_gateway | default(true)
  run_once: true

- name: Build secrets data
  ansible.builtin.set_fact:
    migration_secrets:
      controller_secret_key: "{{ controller_secret_raw.content | b64decode | trim }}"
      hub_secret_key: "{{ hub_secret_raw.stdout | trim | regex_replace('^[''\"]+|[''\"]+$', '') }}"
      hub_db_fields_encryption_key: "{{ hub_db_fields_key_raw.content | b64decode | trim }}"
      gateway_secret_key: "{{ gateway_secret_raw.content | b64decode | trim }}"
  run_once: true

- name: Write secrets file from template
  ansible.builtin.template:
    src: secrets.yml.j2
    dest: "{{ artifact_dir }}/secrets.yml"
    mode: "0600"
  delegate_to: "{{ groups['source_gateway'][0] }}"
  run_once: true
