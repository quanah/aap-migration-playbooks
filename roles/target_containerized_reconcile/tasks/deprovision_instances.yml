---
- name: List instances on target controller
  ansible.builtin.command:
    cmd: "podman exec automation-controller-task awx-manage list_instances"
  delegate_to: "{{ groups['target_controller'][0] }}"
  register: instance_list
  changed_when: false
  run_once: true

- name: Display current instances
  ansible.builtin.debug:
    var: instance_list.stdout_lines
  run_once: true

- name: Identify orphaned instances (stale heartbeat)
  ansible.builtin.shell:
    cmd: >-
      podman exec automation-controller-task bash -c '
      list_output=$(awx-manage list_instances --no-color);
      current_time=$(date +%s);
      echo "$list_output" | grep -E "^\s+\S+\s+capacity=" | while read line; do
        hostname=$(echo "$line" | awk "{print \$1}");
        heartbeat=$(echo "$line" | grep -oP "heartbeat=\"\K[^\"]+");
        if [ -n "$heartbeat" ]; then
          hb_timestamp=$(date -d "$heartbeat" +%s 2>/dev/null || echo 0);
          age=$((current_time - hb_timestamp));
          if [ $age -gt 600 ]; then
            echo "$hostname (heartbeat age: ${age}s)";
          fi;
        else
          echo "$hostname (no heartbeat)";
        fi;
      done'
  delegate_to: "{{ groups['target_controller'][0] }}"
  register: orphaned_instances
  changed_when: false
  failed_when: false
  run_once: true

- name: Display orphaned instances to deprovision
  ansible.builtin.debug:
    msg: "Orphaned instances to remove: {{ orphaned_instances.stdout_lines | default([]) }}"
  when: orphaned_instances.stdout_lines | default([]) | length > 0
  run_once: true

- name: Confirm instance deprovision
  ansible.builtin.pause:
    prompt: >-
      About to deprovision {{ orphaned_instances.stdout_lines | length }} orphaned instances (heartbeat older than 10 minutes).
      Review the list above. Press Enter to continue or Ctrl+C to abort.
  when:
    - confirm_destructive_operations | default(true)
    - orphaned_instances.stdout_lines | default([]) | length > 0
  run_once: true

- name: Deprovision orphaned instances
  ansible.builtin.command:
    cmd: >-
      podman exec automation-controller-task
      awx-manage deprovision_instance --hostname={{ item.split()[0] }}
  delegate_to: "{{ groups['target_controller'][0] }}"
  loop: "{{ orphaned_instances.stdout_lines | default([]) }}"
  when: orphaned_instances.stdout_lines | default([]) | length > 0
  run_once: true
