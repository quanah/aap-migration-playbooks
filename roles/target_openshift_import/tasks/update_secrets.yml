---
# --- Read secrets from temp pod (managed or external + pod) ---

- name: Read secrets from artifact (pod)
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ kubeconfig }}"
    namespace: "{{ ocp_namespace }}"
    pod: "{{ temp_pg_pod_name }}"
    command: "cat /tmp/aap-temp-pvc/artifact/secrets.yml"
  register: artifact_secrets_raw
  when: target_db_type == 'managed' or db_restore_host | default('') == 'pod'

# --- Read secrets from bastion (external + bastion) ---

- name: Read secrets from artifact (bastion)
  ansible.builtin.slurp:
    src: "{{ artifact_dir }}/secrets.yml"
  delegate_to: "{{ db_restore_host }}"
  register: artifact_secrets_bastion_raw
  when:
    - target_db_type == 'external'
    - db_restore_host | default('') != 'pod'

- name: Parse artifact secrets (pod)
  ansible.builtin.set_fact:
    artifact_secrets: "{{ artifact_secrets_raw.stdout | from_yaml }}"
  no_log: true
  when: artifact_secrets_raw is not skipped

- name: Parse artifact secrets (bastion)
  ansible.builtin.set_fact:
    artifact_secrets: "{{ artifact_secrets_bastion_raw.content | b64decode | from_yaml }}"
  no_log: true
  when: artifact_secrets_bastion_raw is not skipped

# --- Update OCP secrets (same for all paths) ---

- name: Update controller secret key
  ansible.builtin.command:
    cmd: >-
      oc set data secret/{{ controller_secret_name }}
      secret_key="{{ artifact_secrets.controller_secret_key }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  no_log: true
  when: migrate_controller | default(true)

- name: Update gateway secret key
  ansible.builtin.command:
    cmd: >-
      oc set data secret/{{ gateway_secret_name }}
      secret_key="{{ artifact_secrets.gateway_secret_key }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  no_log: true
  when: migrate_gateway | default(true)

- name: Update hub database fields encryption key
  ansible.builtin.command:
    cmd: >-
      oc set data secret/{{ hub_secret_name }}
      database_fields.symmetric.key="{{ artifact_secrets.hub_db_fields_encryption_key }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  no_log: true
  when: migrate_hub | default(true)
