---
- name: Validate Ansible version
  ansible.builtin.assert:
    that:
      - ansible_version.full is version('2.15', '>=')
    fail_msg: "Ansible 2.15+ is required. Found {{ ansible_version.full }}"
    quiet: true

- name: Check required collections are installed
  ansible.builtin.command:
    cmd: "ansible-galaxy collection list {{ item }}"
  delegate_to: localhost
  run_once: true
  changed_when: false
  loop:
    - community.postgresql
    - ansible.posix

- name: Verify connectivity to all hosts
  ansible.builtin.ping:

- name: Display migration configuration
  ansible.builtin.debug:
    msg: |
      Migration Configuration:
        AAP version required: {{ required_aap_version }}
        PostgreSQL version required: {{ required_postgresql_version }}
        Skip version check: {{ skip_version_check }}
        Confirm destructive ops: {{ confirm_destructive_operations }}
        Migrate controller: {{ migrate_controller | default(true) }}
        Migrate hub: {{ migrate_hub | default(true) }}
        Migrate gateway: {{ migrate_gateway | default(true) }}
        Source DB type: {{ source_db_type }}
        Target DB type: {{ target_db_type }}
  run_once: true

- name: Validate source_db_type value
  ansible.builtin.assert:
    that:
      - source_db_type in ['managed', 'external']
    fail_msg: "source_db_type must be 'managed' or 'external', got '{{ source_db_type }}'"
    quiet: true
  run_once: true

- name: Validate target_db_type value
  ansible.builtin.assert:
    that:
      - target_db_type in ['managed', 'external']
    fail_msg: "target_db_type must be 'managed' or 'external', got '{{ target_db_type }}'"
    quiet: true
  run_once: true

- name: Validate source external database variables are defined
  ansible.builtin.assert:
    that:
      - source_pg_host is defined and source_pg_host | length > 0
      - source_pg_admin_user is defined and source_pg_admin_user | length > 0
      - source_pg_admin_password is defined and source_pg_admin_password | length > 0
    fail_msg: >-
      When source_db_type is 'external', you must define source_pg_host,
      source_pg_admin_user, and source_pg_admin_password in your inventory.
    quiet: true
  run_once: true
  when: source_db_type == 'external'

- name: Validate target external database variables are defined
  ansible.builtin.assert:
    that:
      - target_pg_host is defined and target_pg_host | length > 0
      - target_pg_admin_user is defined and target_pg_admin_user | length > 0
      - target_pg_admin_password is defined and target_pg_admin_password | length > 0
    fail_msg: >-
      When target_db_type is 'external', you must define target_pg_host,
      target_pg_admin_user, and target_pg_admin_password in your inventory.
    quiet: true
  run_once: true
  when: target_db_type == 'external'

- name: Fail if source external DB but source_db group has hosts
  ansible.builtin.fail:
    msg: >-
      source_db_type is 'external' but the source_db inventory group contains hosts.
      Remove hosts from source_db when using an external database.
  when:
    - source_db_type == 'external'
    - groups['source_db'] is defined
    - groups['source_db'] | length > 0
  run_once: true

- name: Warn if source managed DB but source_db group is empty
  ansible.builtin.debug:
    msg: >-
      WARNING: source_db_type is 'managed' but the source_db inventory group is empty.
      Ensure the source_db group contains the database server host.
  when:
    - source_db_type == 'managed'
    - groups['source_db'] is defined
    - groups['source_db'] | length == 0
  run_once: true

- name: Fail if target external DB but target_db group has hosts
  ansible.builtin.fail:
    msg: >-
      target_db_type is 'external' but the target_db inventory group contains hosts.
      Remove hosts from target_db when using an external database.
  when:
    - target_db_type == 'external'
    - groups['target_db'] is defined
    - groups['target_db'] | length > 0
  run_once: true

- name: Warn if managed DB but target_db group is empty
  ansible.builtin.debug:
    msg: >-
      WARNING: target_db_type is 'managed' but the target_db inventory group is empty.
      The containerized path requires hosts in the target_db group for managed databases.
  when:
    - target_db_type == 'managed'
    - groups['target_db'] is defined
    - groups['target_db'] | length == 0
  run_once: true

- name: Validate db_restore_host or inventory group is available (external)
  ansible.builtin.assert:
    that:
      - >-
        (db_restore_host is defined and db_restore_host | length > 0) or
        (groups['target_gateway'] is defined and groups['target_gateway'] | length > 0) or
        (groups['target_ocp_bastion'] is defined and groups['target_ocp_bastion'] | length > 0)
    fail_msg: >-
      When target_db_type is 'external', either db_restore_host must be set or
      the target_gateway (containerized) or target_ocp_bastion (OpenShift) inventory
      group must contain at least one host.
    quiet: true
  run_once: true
  when: target_db_type == 'external'

- name: Display source external database configuration
  ansible.builtin.debug:
    msg: |
      Source External Database Configuration:
        Source PG host: {{ source_pg_host }}
        Source PG port: {{ source_pg_port }}
        Source PG SSL mode: {{ source_pg_ssl_mode }}
        Source PG admin user: {{ source_pg_admin_user }}
  run_once: true
  when: source_db_type == 'external'

- name: Display target external database configuration
  ansible.builtin.debug:
    msg: |
      Target External Database Configuration:
        Target PG host: {{ target_pg_host }}
        Target PG port: {{ target_pg_port }}
        Target PG SSL mode: {{ target_pg_ssl_mode }}
        Target PG admin user: {{ target_pg_admin_user }}
        DB restore host: {{ db_restore_host | default('(auto)') }}
  run_once: true
  when: target_db_type == 'external'
