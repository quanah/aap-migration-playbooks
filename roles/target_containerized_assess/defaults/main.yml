---
skip_version_check: false
required_postgresql_version: "15"

# Containerized installer settings - MUST be configured for your environment
# containerized_installer_dir: Path to the AAP containerized installer bundle
# containerized_installer_inventory: Inventory file (relative to installer_dir or absolute path)
# containerized_installer_backup_command: Command to run backup (executed from installer_dir)
containerized_installer_dir: ~/ansible-automation-platform-containerized-setup-bundle-2.6-1
containerized_installer_inventory: inventory
containerized_installer_backup_command: "./setup.sh -b"
