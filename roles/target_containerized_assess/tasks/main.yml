---
- name: Validate filesystem space for artifact transfer
  ansible.builtin.command:
    cmd: "df -h ~"
  delegate_to: "{{ groups['target_gateway'][0] }}"
  register: target_fs_space
  changed_when: false

- name: Display target filesystem space
  ansible.builtin.debug:
    var: target_fs_space.stdout_lines
  run_once: true

- name: Verify artifact exists on target
  ansible.builtin.stat:
    path: "{{ artifact_archive }}"
  delegate_to: "{{ groups['target_gateway'][0] }}"
  register: target_artifact

- name: Verify artifact checksum file exists on target
  ansible.builtin.stat:
    path: "{{ artifact_checksum }}"
  delegate_to: "{{ groups['target_gateway'][0] }}"
  register: target_artifact_checksum

- name: Validate artifact checksum
  ansible.builtin.command:
    cmd: "sha256sum --check {{ artifact_checksum }}"
  args:
    chdir: "{{ artifact_archive | dirname }}"
  delegate_to: "{{ groups['target_gateway'][0] }}"
  changed_when: false
  when: target_artifact.stat.exists and target_artifact_checksum.stat.exists

- name: Extract artifact on target
  ansible.builtin.command:
    cmd: "tar xf {{ artifact_archive }}"
  args:
    chdir: "{{ artifact_archive | dirname }}"
  delegate_to: "{{ groups['target_gateway'][0] }}"
  when: target_artifact.stat.exists

- name: Verify artifact internal checksums
  ansible.builtin.command:
    cmd: "sha256sum --check sha256sum.txt"
  args:
    chdir: "{{ artifact_dir }}"
  delegate_to: "{{ groups['target_gateway'][0] }}"
  changed_when: false
  when: target_artifact.stat.exists

# --- Managed DB assessment ---

- name: Verify PostgreSQL version on target (managed)
  ansible.builtin.shell:
    cmd: "podman exec postgresql psql -t -c 'SHOW server_version;'"
  delegate_to: "{{ groups['target_db'][0] }}"
  register: target_pg_version
  changed_when: false
  when: target_db_type == 'managed'

- name: Validate PostgreSQL version on target (managed)
  ansible.builtin.assert:
    that:
      - target_pg_version.stdout is search(required_postgresql_version)
    fail_msg: >-
      Target PostgreSQL version mismatch. Expected {{ required_postgresql_version }},
      got {{ target_pg_version.stdout | trim }}.
    quiet: true
  when:
    - target_db_type == 'managed'
    - not skip_version_check

- name: Create backup of initial containerized environment (managed)
  ansible.builtin.command:
    cmd: >-
      ansible-playbook -i {{ containerized_installer_inventory }}
      ansible.containerized_installer.backup
  delegate_to: "{{ groups['target_gateway'][0] }}"
  when:
    - target_db_type == 'managed'
    - target_artifact.stat.exists

# --- External DB assessment ---

- name: Set db_restore_host for containerized external DB
  ansible.builtin.set_fact:
    db_restore_host: "{{ db_restore_host | default(groups['target_gateway'][0]) }}"
  when: target_db_type == 'external'

- name: Verify psql client is installed (external)
  ansible.builtin.command:
    cmd: psql --version
  delegate_to: "{{ db_restore_host }}"
  changed_when: false
  when: target_db_type == 'external'

- name: Verify pg_restore client is installed (external)
  ansible.builtin.command:
    cmd: pg_restore --version
  delegate_to: "{{ db_restore_host }}"
  changed_when: false
  when: target_db_type == 'external'

- name: Verify connectivity to external database
  ansible.builtin.command:
    cmd: >-
      psql -h {{ target_pg_host }} -p {{ target_pg_port }}
      -U {{ target_pg_admin_user }} -c 'SELECT 1;'
  delegate_to: "{{ db_restore_host }}"
  environment:
    PGPASSWORD: "{{ target_pg_admin_password }}"
    PGSSLMODE: "{{ target_pg_ssl_mode }}"
  changed_when: false
  no_log: true
  when: target_db_type == 'external'

- name: Check PostgreSQL version on external database
  ansible.builtin.command:
    cmd: >-
      psql -h {{ target_pg_host }} -p {{ target_pg_port }}
      -U {{ target_pg_admin_user }} -t -c 'SHOW server_version;'
  delegate_to: "{{ db_restore_host }}"
  environment:
    PGPASSWORD: "{{ target_pg_admin_password }}"
    PGSSLMODE: "{{ target_pg_ssl_mode }}"
  register: target_pg_version_external
  changed_when: false
  no_log: true
  when: target_db_type == 'external'

- name: Validate PostgreSQL version on external database
  ansible.builtin.assert:
    that:
      - target_pg_version_external.stdout is search(required_postgresql_version)
    fail_msg: >-
      External PostgreSQL version mismatch. Expected {{ required_postgresql_version }},
      got {{ target_pg_version_external.stdout | trim }}.
    quiet: true
  when:
    - target_db_type == 'external'
    - not skip_version_check

# --- Summary ---

- name: Target containerized assessment complete
  ansible.builtin.debug:
    msg: |
      Target Assessment Complete:
        Database type: {{ target_db_type }}
        Artifact verified: {{ target_artifact.stat.exists }}
        PostgreSQL version: {{ (target_pg_version.stdout | default(target_pg_version_external.stdout | default('N/A'))) | trim }}
        {% if target_db_type == 'managed' %}Initial backup created{% endif %}
        {% if target_db_type == 'external' %}External DB host: {{ target_pg_host }}:{{ target_pg_port }}{% endif %}
  run_once: true
