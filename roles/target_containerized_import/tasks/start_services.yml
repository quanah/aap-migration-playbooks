---
- name: Start PCP on all nodes (if configured)
  ansible.builtin.systemd:
    name: "{{ pcp_service }}"
    state: started
    scope: user
  ignore_errors: true

- name: Start Redis services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    scope: user
  loop: "{{ redis_services }}"
  ignore_errors: true
  when: inventory_hostname in groups['target_gateway']

- name: Start controller services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    scope: user
  loop: "{{ controller_services + controller_extra_services }}"
  when:
    - migrate_controller | default(true)
    - inventory_hostname in groups['target_controller']

- name: Start hub services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    scope: user
  loop: "{{ hub_services }}"
  when:
    - migrate_hub | default(true)
    - inventory_hostname in groups['target_hub']

- name: Start EDA services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    scope: user
  loop: "{{ eda_services }}"
  when:
    - migrate_eda | default(false)
    - inventory_hostname in groups['target_eda']

- name: Start gateway services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    scope: user
  loop: "{{ gateway_services }}"
  when:
    - migrate_gateway | default(true)
    - inventory_hostname in groups['target_gateway']

- name: Wait for services to stabilize
  ansible.builtin.pause:
    seconds: 30

- name: Services import phase complete
  ansible.builtin.debug:
    msg: "All containerized services restarted after database import"
  run_once: true
