---
- name: Confirm service stop operation
  ansible.builtin.pause:
    prompt: >-
      About to stop all AAP containerized services (except database) for database import.
      This will cause downtime on the target environment.
      Press Enter to continue or Ctrl+C to abort.
  when: confirm_destructive_operations | default(true)
  run_once: true

- name: Stop PCP on all nodes (if configured)
  ansible.builtin.systemd:
    name: "{{ pcp_service }}"
    state: stopped
    scope: user
  ignore_errors: true

- name: Stop controller services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    scope: user
  loop: "{{ controller_services + controller_extra_services }}"
  when:
    - migrate_controller | default(true)
    - inventory_hostname in groups['target_controller']

- name: Stop hub services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    scope: user
  loop: "{{ hub_services }}"
  when:
    - migrate_hub | default(true)
    - inventory_hostname in groups['target_hub']

- name: Stop EDA services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    scope: user
  loop: "{{ eda_services }}"
  when:
    - migrate_eda | default(false)
    - inventory_hostname in groups['target_eda']

- name: Stop gateway services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    scope: user
  loop: "{{ gateway_services }}"
  when:
    - migrate_gateway | default(true)
    - inventory_hostname in groups['target_gateway']

- name: Stop Redis services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    scope: user
  loop: "{{ redis_services }}"
  ignore_errors: true
  when: inventory_hostname in groups['target_gateway']
